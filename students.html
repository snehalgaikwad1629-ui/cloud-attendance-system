<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Students | AMS</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><div class="brand">Attendance Management System</div><div class="top-actions"><span id="userEmail" class="small"></span><button id="logoutBtn">Logout</button></div></header><div class="layout"><nav class="sidebar"><a href="dashboard.html">Dashboard</a><a class="active" href="students.html">Students</a><a href="attendance.html">Mark Attendance</a><a href="report.html">Attendance Report</a></nav>
<main class="content"><h1 class="page-title">Students</h1><p class="sub-title">Add and manage student records.</p>
<section class="panel"><h2>Add student</h2><form id="studentForm"><div class="form-grid"><div><label for="studentId">Student ID</label><input id="studentId" required placeholder="e.g. STU001"></div><div><label for="studentName">Full name</label><input id="studentName" required placeholder="Student name"></div><div><label for="rollNo">Roll number</label><input id="rollNo" required placeholder="e.g. 24"></div></div><button class="primary" type="submit" style="margin-top:14px">Add Student</button><p id="studentMessage" class="message"></p></form></section>
<section class="panel"><div class="toolbar"><h2 style="margin:0">Student records</h2><input id="search" placeholder="Search name, ID or roll no"></div><div class="table-wrap"><table><thead><tr><th>Student ID</th><th>Name</th><th>Roll No.</th><th>Action</th></tr></thead><tbody id="studentRows"></tbody></table></div></section>
</main></div><script type="module" src="students.js"></script></body></html>
