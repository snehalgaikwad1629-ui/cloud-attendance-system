<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance Management System | Login</title><link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="logo">AMS</div>
    <h1>Attendance Management System</h1>
    <p class="muted">Cloud Computing Mini Project</p>
    <form id="loginForm">
      <label for="email">Email address</label><input id="email" type="email" autocomplete="username" required placeholder="Enter your Firebase email">
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Enter password">
      <button type="submit" class="primary full">Login</button>
      <p id="message" class="message" role="status"></p>
    </form>
    <p class="small muted">Use an account created in Firebase Authentication.</p>
  </main>
  <script type="module" src="login.js"></script>
</body></html>
